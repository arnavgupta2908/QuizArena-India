<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QUIZARENA INDIA</title>
<style>
:root{--bg:#050a18;--c:rgba(255,255,255,.06);--t:#fff;--m:#a9b4d0;--g:#f5b800;--b:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,#0f2250,#050a18 60%) fixed;color:var(--t);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:960px;margin:auto;padding:20px}h1,h2,h3{line-height:1.2}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:20px;margin:14px 0;backdrop-filter:blur(10px)}
.logo{font-weight:900;letter-spacing:.12em;color:var(--g)}.hero{text-align:center;padding:50px 0 20px}.hero h1{font-size:clamp(28px,6vw,48px);margin:.3em 0}
button,.btn{background:linear-gradient(135deg,#ffd54a,#f5a800);color:#111;border:0;border-radius:10px;padding:12px 22px;font-weight:800;cursor:pointer;font-size:15px}
button.s{background:var(--c);color:var(--t);border:1px solid var(--b)}button.r{background:#e5484d;color:#fff}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:11px;margin:4px 0 12px;border-radius:9px;border:1px solid var(--b);background:#0b1430;color:#fff;font:inherit}
label{font-size:14px;color:var(--m)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.qr{display:block;margin:12px auto;max-width:280px;width:100%;border-radius:12px;background:#fff;padding:8px}
.pay{text-align:center;font-size:24px;font-weight:900;color:var(--g)}.err{color:#ff8a8a;font-weight:600}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.st div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px}.st b{font-size:26px;color:var(--g);display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800}.PENDING{background:#5a4a00;color:#ffd54a}.CONFIRMED{background:#0b4a2a;color:#5be39a}.REJECTED{background:#5a1a1a;color:#ff8a8a}
nav{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;font:inherit}a{color:var(--g)}footer{text-align:center;color:var(--m);font-size:13px;padding:30px 0}
</style></head><body><div class="w" id="app">Loading…</div>

const D={title:"QUIZARENA INDIA",tagline:"Think. Compete. Win.",heroH:"Challenge Your Knowledge. Prove Your Skills.",heroT:"India's online skill-based quiz competition.",info:"A knowledge-based quiz contest open to Indian participants. Winners are decided purely on quiz performance.",fee:50,open:true,dates:"To be announced",prize:"To be announced",contact:"support@quizarenaindia.example",rules:"Participants must be 13+ (under 18 need guardian consent). One entry per person. Results are based on skill and knowledge only. Fee must be paid before the registration is confirmed.",faq:"Q: How do I register?\nA: Click Register Now, fill details, pay via QR and submit the UTR.\nQ: When am I confirmed?\nA: Only after the admin manually verifies your payment.",terms:"Edit this text in the admin panel.",privacy:"We collect only the details needed to run the competition and do not sell them.",refund:"Fees are refundable only if the competition is cancelled by the organiser.",qrId:""};
let S={...D},db,user,assets,dl,mode='home',F={},R=null,msg='',busy=false,canAdmin=false,regs=[],tab='dash',sel=null,q='',flt='ALL',unsub=[];
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qrSrc=()=>S.qrId?'/_blob/'+S.qrId:DQR;
function route(){mode=location.hash==='#admin'?'admin':(mode==='admin'?'home':mode);draw()}
addEventListener('hashchange',route);
async function init(){draw();
 try{[db,user,assets,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets'),claude.use('downloads')])}catch(x){}
 canAdmin=!!(user&&user.canEdit());
 if(db){try{db.doc('settings/site').onSnapshot(d=>{S={...D,...(d.exists?d.data():{})};draw()})}catch(x){}
  if(canAdmin)try{db.collection('regs').onSnapshot(s=>{regs=s.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);if(mode==='admin')draw()})}catch(x){}}
 draw()}
function pub(){return `<div class="hero"><div class="logo">🏆 ${e(S.title)}</div><p style="color:var(--m)">${e(S.tagline)}</p><h1>${e(S.heroH)}</h1><p>${e(S.heroT)}</p><button onclick="go('form')" ${S.open?'':'disabled'}>${S.open?'REGISTER NOW':'REGISTRATIONS CLOSED'}</button></div>
<div class="card"><h2>About the competition</h2><p>${e(S.info)}</p><p><b>Dates:</b> ${e(S.dates)} · <b>Prizes:</b> ${e(S.prize)}</p></div>
<div class="card"><h2>How to participate</h2><p>1. Fill your details → 2. Pay the fee by UPI QR → 3. Submit UTR &amp; screenshot → 4. Wait for admin verification.</p></div>
<div class="card"><h2>Registration fee</h2><p style="font-size:28px;color:var(--g);font-weight:900">₹${e(S.fee)}</p></div>
<div class="card"><h2>Rules &amp; eligibility</h2><pre>${e(S.rules)}</pre></div><div class="card"><h2>FAQ</h2><pre>${e(S.faq)}</pre></div>
<div class="card"><h2>Contact &amp; support</h2><p>${e(S.contact)}</p></div>
<footer><a href="#" onclick="pol('terms');return false">Terms &amp; Conditions</a> · <a href="#" onclick="pol('privacy');return false">Privacy Policy</a> · <a href="#" onclick="pol('refund');return false">Refund Policy</a></footer>`}
function pol(k){mode='pol';msg=k;draw()}
function field(id,l,t='text',req=1){return `<div><label>${l}${req?' *':''}</label><input id="${id}" type="${t}" value="${e(F[id]||'')}"></div>`}
function form(){return `<div class="card"><h2>Step 1: Participant details</h2><div class="g">${field('name','Full name')}${field('mobile','Mobile number','tel')}${field('email','Email','email')}${field('age','Age','number')}${field('state','State')}${field('city','City')}${field('school','School/College',"text",0)}<div><label>Gender (optional)</label><select id="gender"><option value="">—</option><option>Male</option><option>Female</option><option>Other</option></select></div></div>
<label><input type="checkbox" id="tc" style="width:auto"> I accept the Terms &amp; Conditions and Privacy Policy</label><p class="err">${e(msg)}</p><button class="s" onclick="go('home')">Back</button> <button onclick="next()">NEXT</button></div>`}
function next(){['name','mobile','email','age','state','city','school','gender'].forEach(i=>F[i]=$('#'+i).value.trim());
 const m=!/^[6-9]\d{9}$/.test(F.mobile.replace(/^(\+91|0)/,''))?'Enter a valid 10-digit Indian mobile number.':!/^\S+@\S+\.\S+$/.test(F.email)?'Enter a valid email.':!(F.age>=5&&F.age<=100)?'Enter a valid age.':(!F.name||!F.state||!F.city)?'Fill all required fields.':!$('#tc').checked?'Please accept the Terms & Privacy Policy.':'';
 msg=m;if(!m)mode='pay';draw()}
function payPg(){return `<div class="card" style="text-align:center"><h2>Step 2: Payment</h2><h3>Registration Fee: ₹${e(S.fee)}</h3><p>Scan the QR Code Below to Pay</p><img class="qr" src="${qrSrc()}" alt="Payment QR"><div class="pay">Pay 50 rupees here ☝️</div>
<p style="color:var(--m)">Pay ₹${e(S.fee)} using any UPI app, then enter the UTR / Transaction ID and upload a screenshot. Your payment is verified manually by the admin.</p><div style="text-align:left"><label>UPI Transaction ID / UTR *</label><input id="utr"><label>Payment screenshot (JPG/PNG) *</label><input id="shot" type="file" accept="image/jpeg,image/png"><label><input type="checkbox" id="paid" style="width:auto"> I confirm I have made the payment</label></div><p class="err">${e(msg)}</p>${busy?'Submitting…':`<button class="s" onclick="go('form')">Back</button> <button onclick="submit()">SUBMIT REGISTRATION</button>`}</div>`}
async function submit(){const utr=$('#utr').value.trim(),f=$('#shot').files[0];
 msg=!S.open?'Registrations are closed.':!db||!assets?'Registration needs a signed-in session on this page. Please open the link while logged in.':utr.length<8?'Enter a valid UTR (min 8 characters).':!f||!/^image\/(jpeg|png)$/.test(f.type)?'Upload a JPG or PNG screenshot.':!$('#paid').checked?'Please confirm payment.':'';
 if(msg)return draw();busy=true;draw();
 try{const a=await assets.upload(f),id='QA'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(),uid=await user.id();
  const rec={rid:id,...F,amount:S.fee,utr,shot:a.id,status:'PENDING',pay:'PENDING',at:Date.now()};
  await db.doc('regs/'+uid).set(rec);R=rec;mode='done'}catch(x){msg='Network or permission error: '+(x.message||x.code||'try again')}
 busy=false;draw()}
const done=()=>`<div class="card"><h2>✅ Your registration has been submitted successfully!</h2><p>Your payment is currently awaiting verification by the QUIZARENA INDIA administration team. Your participation will be confirmed only after successful payment verification.</p><p><b>Registration ID:</b> ${e(R.rid)}<br><b>Name:</b> ${e(R.name)}<br><b>Date:</b> ${new Date(R.at).toLocaleString()}<br><b>Payment status:</b> <span class="tag PENDING">PENDING</span></p><p>Please save your Registration ID.</p><button onclick="go('home')">Home</button></div>`;
function go(m){mode=m;msg='';draw()}
const polPg=()=>`<div class="card"><h2>${e({terms:'Terms & Conditions',privacy:'Privacy Policy',refund:'Refund Policy'}[msg])}</h2><pre>${e(S[msg])}</pre><button onclick="go('home')">Back</button></div>`;
/* ADMIN */
function admin(){if(!user||!canAdmin)return `<div class="card"><h2>🔒 Admin login</h2><p>Sign in with your authorised admin account in Claude, then reload <b>#admin</b>. Access is enforced by the platform, not by this page.</p></div>`;
 const c=k=>regs.filter(r=>r.status===k).length,ok=regs.filter(r=>r.status==='CONFIRMED');
 let h=`<div class="card"><div class="logo">ADMIN · ${e(S.title)}</div><nav>${['dash','regs','content','qr'].map(t=>`<button class="${tab===t?'':'s'}" onclick="tab='${t}';sel=null;draw()">${{dash:'Overview',regs:'Registrations',content:'Website content',qr:'Payment QR'}[t]}</button>`).join('')}</nav></div>`;
 if(tab==='dash')h+=`<div class="st"><div><b>${regs.length}</b>Total</div><div><b>${c('PENDING')}</b>Pending</div><div><b>${ok.length}</b>Confirmed</div><div><b>${c('REJECTED')}</b>Rejected</div><div><b>${ok.length}</b>Verified payments</div><div><b>₹${ok.reduce((s,r)=>s+Number(r.amount||0),0)}</b>Verified revenue</div></div>`;
 if(tab==='regs'){if(sel){const r=regs.find(x=>x._id===sel);h+=`<div class="card"><h3>${e(r.rid)} <span class="tag ${r.status}">${r.status}</span></h3><p>${e(r.name)} · ${e(r.mobile)} · ${e(r.email)}<br>Age ${e(r.age)} · ${e(r.city)}, ${e(r.state)} · ${e(r.school)} ${e(r.gender)}<br>UTR: <b>${e(r.utr)}</b> · ₹${e(r.amount)} · ${new Date(r.at).toLocaleString()}</p><a href="/_blob/${e(r.shot)}" target="_blank"><img src="/_blob/${e(r.shot)}" style="max-width:300px;border-radius:10px"></a><br><input id="rej" placeholder="Rejection reason" value="${e(r.reason||'')}"><button onclick="act('CONFIRMED')">CONFIRM PAYMENT</button> <button class="r" onclick="act('REJECTED')">REJECT PAYMENT</button> <button class="s" onclick="act('PENDING')">KEEP PENDING</button> <button class="s" onclick="sel=null;draw()">Close</button></div>`}
 else{const L=regs.filter(r=>(flt==='ALL'||r.status===flt)&&(r.name+r.mobile+r.rid).toLowerCase().includes(q.toLowerCase()));
 h+=`<div class="card"><div class="g"><input placeholder="Search name / mobile / ID" value="${e(q)}" oninput="q=this.value;draw();$('#sq')?.focus()" id="sq"><select onchange="flt=this.value;draw()">${['ALL','PENDING','CONFIRMED','REJECTED'].map(x=>`<option ${x===flt?'selected':''}>${x}</option>`).join('')}</select></div><button class="s" onclick="csv()">Export CSV</button><div class="tw"><table><tr><th>ID<th>Name<th>Mobile<th>Email<th>Age<th>State<th>City<th>UTR<th>Date<th>Status<th></tr>${L.map(r=>`<tr><td>${e(r.rid)}<td>${e(r.name)}<td>${e(r.mobile)}<td>${e(r.email)}<td>${e(r.age)}<td>${e(r.state)}<td>${e(r.city)}<td>${e(r.utr)}<td>${new Date(r.at).toLocaleDateString()}<td><span class="tag ${r.status}">${r.status}</span><td><button onclick="sel='${r._id}';draw()">Review</button></tr>`).join('')}</table></div></div>`}}
 if(tab==='content')h+=`<div class="card"><h3>Website content</h3>${[['title','Website title'],['tagline','Tagline'],['heroH','Hero heading'],['heroT','Hero text'],['fee','Registration fee (₹)'],['dates','Competition dates'],['prize','Prize info'],['contact','Contact info']].map(([k,l])=>`<label>${l}</label><input data-k="${k}" value="${e(S[k])}">`).join('')}${[['info','Competition info'],['rules','Rules & eligibility'],['faq','FAQ'],['terms','Terms & Conditions'],['privacy','Privacy Policy'],['refund','Refund Policy']].map(([k,l])=>`<label>${l}</label><textarea rows="4" data-k="${k}">${e(S[k])}</textarea>`).join('')}<label><input type="checkbox" id="op" style="width:auto" ${S.open?'checked':''}> Registrations open</label><p class="err">${e(msg)}</p><button onclick="saveS()">Save changes</button></div>`;
 if(tab==='qr')h+=`<div class="card"><h3>Payment QR code</h3><img class="qr" src="${qrSrc()}"><input type="file" id="qf" accept="image/*"><button onclick="upQR()">Upload &amp; replace</button> <button class="r" onclick="rmQR()">Remove (reset to original)</button><p class="err">${e(msg)}</p></div>`;
 return h}
async function act(s){const r=regs.find(x=>x._id===sel);try{await db.doc('regs/'+r._id).update({status:s,pay:s==='CONFIRMED'?'VERIFIED':s,reason:s==='REJECTED'?$('#rej').value:'',actedAt:Date.now(),actedBy:await user.id()});sel=null}catch(x){alert('Failed: '+(x.message||x.code))}}
async function saveS(){const o={open:$('#op').checked};document.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.dataset.k==='fee'?Number(i.value)||0:i.value);try{await db.doc('settings/site').set({...S,...o});msg='Saved ✓'}catch(x){msg='Save failed: '+(x.message||x.code)}draw()}
async function upQR(){const f=$('#qf').files[0];if(!f)return;try{const a=await assets.upload(f);await db.doc('settings/site').set({...S,qrId:a.id});msg='QR updated ✓'}catch(x){msg='Failed: '+(x.message||x.code)}draw()}
async function rmQR(){try{await db.doc('settings/site').set({...S,qrId:''});msg='Reset ✓'}catch(x){msg='Failed'}draw()}
async function csv(){const k=['rid','name','mobile','email','age','state','city','school','gender','utr','amount','status'],t=[k.join(',')].concat(regs.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');try{await dl.save({filename:'registrations.csv',data:t})}catch(x){}}
function draw(){const a=$('#app');if(!a||document.activeElement?.id==='sq'&&mode==='admin')return;
 a.innerHTML=mode==='admin'?admin():mode==='form'?form():mode==='pay'?payPg():mode==='done'?done():mode==='pol'?polPg():pub()}
route();init();
</script></body></html>
